<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baap Aniket | Interactive Art</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  height:100vh;
  background:black;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

/* Floating Circles */
.circle{
  position:absolute;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.25);
  animation:float 6s linear infinite;
}

/* Animation */
@keyframes float{
  from{transform:translateY(100vh) scale(0.5);}
  to{transform:translateY(-100px) scale(1.2);}
}

/* Center Text */
.center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  z-index:5;
}

.center h1{
  font-size:42px;
  letter-spacing:5px;
  text-shadow:0 0 15px white;
}

.center p{
  opacity:0.7;
  font-size:14px;
}

</style>
</head>

<body>

<div class="center">
  <h1>BAAP ANIKET</h1>
  <p>Tap Anywhere 🎵</p>
  <p>Interactive Art Website</p>
</div>

<audio id="sound" src="sound.mp3"></audio>

<script>

const audio = document.getElementById("sound");

/* Create Floating Art */
function createCircle(){

  const c = document.createElement("div");
  c.classList.add("circle");

  c.style.left = Math.random()*100+"vw";
  c.style.width = 30+Math.random()*80+"px";
  c.style.height = c.style.width;

  document.body.appendChild(c);

  setTimeout(()=>{
    c.remove();
  },6000);

}

/* Generate Art */
setInterval(createCircle,500);


/* Play Sound On Touch */
document.body.addEventListener("click",()=>{

  audio.currentTime = 0;
  audio.play();

});

</script>

</body>
</html>
