
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baap Aniket | Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Poppins&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#12001a;
  font-family:'Poppins',sans-serif;
  animation:bgblink 1s infinite alternate;
}

/* Screen Blink */
@keyframes bgblink{
  0%{background:#12001a;}
  50%{background:#2a003a;}
  100%{background:#12001a;}
}

/* Center Box */
.box{
  background:rgba(0,0,0,0.7);
  padding:35px 30px;
  border-radius:25px;
  text-align:center;
  color:white;
  box-shadow:0 0 40px hotpink;
  z-index:10;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.06);}
  100%{transform:scale(1);}
}

/* Big Name */
#name{
  font-size:60px;
  color:#ff8fcf;
  text-shadow:0 0 25px deeppink;
  margin-bottom:10px;
}

/* Description */
#desc{
  font-size:15px;
  opacity:0.9;
  margin-bottom:15px;
}

/* Flowers */
.flower{
  position:absolute;
  top:-40px;
  font-size:28px;
  animation:fall linear infinite;
  pointer-events:none;
}

@keyframes fall{
  from{transform:translateY(-40px) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}

</style>
</head>

<body onclick="startShow()">

<div class="box">
  <div id="name">BAAP ANIKET</div>

  <div id="desc">
    Tap karo bhai aur awaaj full karlo,<br>
    speaker saaf ho jayega 😄🔊
  </div>

  <div>🌹 Touch Anywhere 🌹</div>
</div>

<audio id="sound" src="sound.mp3"></audio>

<script>

let started=false;
const flowers=["🌹","🌸","🌺","💐","🌷","❤️","💖"];

function startShow(){

  if(started) return;
  started=true;

  playSound();
  startVibration();
  startFlowers();

}

/* Sound */
function playSound(){
  const audio=document.getElementById("sound");
  audio.loop=true;
  audio.play();
}

/* Continuous Vibration */
function startVibration(){
  if(navigator.vibrate){
    setInterval(()=>{
      navigator.vibrate([300,150,300,150]);
    },1000);
  }
}

/* Flowers Generator */
function startFlowers(){

  setInterval(()=>{

    const f=document.createElement("div");
    f.classList.add("flower");

    f.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(2+Math.random()*4)+"s";

    document.body.appendChild(f);

    setTimeout(()=>{
      f.remove();
    },8000);

  },200); // lots of flowers

}

</script>

</body>
</html>
