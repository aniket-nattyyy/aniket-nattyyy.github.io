<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baap Aniket | Fire Love</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Poppins&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#120018;
  font-family:'Poppins',sans-serif;
}

/* Blink Class */
.blink{
  animation:blink 0.1s infinite alternate;
}

@keyframes blink{
  from{background:#120018;}
  to{background:#ff0055;}
}

/* Main Box */
.box{
  background:rgba(0,0,0,0.75);
  padding:35px 30px;
  border-radius:25px;
  text-align:center;
  color:white;
  box-shadow:0 0 50px hotpink;
  z-index:10;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* Name */
#name{
  font-size:60px;
  color:#ff8fcf;
  text-shadow:0 0 30px deeppink;
}

/* Desc */
#desc{
  font-size:15px;
  margin:10px 0;
}

/* Footer */
#footer{
  font-size:13px;
  opacity:0.9;
}

/* Flowers + Fire */
.particle{
  position:absolute;
  top:-40px;
  font-size:26px;
  animation:fall linear infinite;
  pointer-events:none;
}

@keyframes fall{
  from{transform:translateY(-40px) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}

</style>
</head>

<body onclick="startShow()">

<div class="box">
  <div id="name">BAAP ANIKET</div>

  <div id="desc">
    Tap karo bhai aur awaaj full karlo,<br>
    speaker saaf ho jayega 🔊😄
  </div>

  <div id="footer">Made by Baap Aniket 💪🔥</div>
</div>

<audio id="sound" src="sound.mp3"></audio>

<script>

let started=false;

const particles=["🌹","🌸","🌺","💐","🌷","❤️","🔥","🔥","💖"];

function startShow(){

  if(started) return;
  started=true;

  // Start Blink
  document.body.classList.add("blink");

  playSound();
  startVibration();
  startParticles();

}

/* Sound */
function playSound(){
  const audio=document.getElementById("sound");
  audio.loop=true;
  audio.play();
}

/* Vibration */
function startVibration(){
  if(navigator.vibrate){
    setInterval(()=>{
      navigator.vibrate([250,100,250]);
    },900);
  }
}

/* Flowers + Fire */
function startParticles(){

  setInterval(()=>{

    const p=document.createElement("div");
    p.classList.add("particle");

    p.innerHTML=particles[Math.floor(Math.random()*particles.length)];

    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(2+Math.random()*3)+"s";

    document.body.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },7000);

  },180); // many particles

}

</script>

</body>
</html>
