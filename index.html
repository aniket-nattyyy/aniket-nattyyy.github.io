<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aniket | Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle, #ff5fa2, #8b0037);
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Orbitron', sans-serif;
  animation:blink 2s infinite;
}

/* Screen Blink */
@keyframes blink{
  0%{filter:brightness(1);}
  50%{filter:brightness(1.4);}
  100%{filter:brightness(1);}
}

/* Main Box */
.box{
  background:rgba(0,0,0,0.6);
  padding:40px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 0 40px pink;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* Big Name */
#name{
  font-size:70px;
  color:#ffb6d9;
  text-shadow:0 0 20px hotpink;
}

/* Text */
p{
  color:white;
  font-size:18px;
}

/* Falling Flowers */
.flower{
  position:absolute;
  top:-50px;
  font-size:30px;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-50px);}
  to{transform:translateY(110vh);}
}

</style>
</head>

<body onclick="playAll()">

<div class="box">
  <div id="name">ANIKET</div>
  <p>🌹 Tap To Feel Magic 🌹</p>
  <p>Made With ❤️</p>
</div>

<audio id="sound" src="sound.mp3"></audio>

<script>

const emojis = ["🌹","🌸","🌺","💐","🌷"];

// Create Flowers
function createFlower(){
  const flower = document.createElement("div");
  flower.classList.add("flower");
  flower.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

  flower.style.left = Math.random()*100+"vw";
  flower.style.animationDuration = (3+Math.random()*5)+"s";

  document.body.appendChild(flower);

  setTimeout(()=>{
    flower.remove();
  },8000);
}

// Continuous Flowers
setInterval(createFlower,400);

// Play Effects
function playAll(){

  // Sound
  const audio=document.getElementById("sound");
  audio.currentTime=0;
  audio.play();

  // Continuous Vibration
  if(navigator.vibrate){
    navigator.vibrate([300,100,300,100,300,100,300]);
  }

}

</script>

</body>
</html>
